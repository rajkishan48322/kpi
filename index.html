<script>
"use strict";

/* ============================= DATA LAYER ============================= */

const DB_KEYS = {
  roles: "kpi_roles",
  kpas: "kpi_kpas",
  departments: "kpi_departments",
  matrix: "kpi_matrix",
  employees: "kpi_employees",
  targets: "kpi_targets",
  wao: "kpi_workallocationorders",
};

const DB = {
  all(table) {
    try { return JSON.parse(localStorage.getItem(DB_KEYS[table])) || []; }
    catch (e) { return []; }
  },
  save(table, rows) {
    localStorage.setItem(DB_KEYS[table], JSON.stringify(rows));
  },
  find(table, id) {
    return DB.all(table).find(r => r.id === id) || null;
  },
  upsert(table, row) {
    const rows = DB.all(table);
    const idx = rows.findIndex(r => r.id === row.id);
    if (idx >= 0) rows[idx] = row; else rows.push(row);
    DB.save(table, rows);
  },
  remove(table, id) {
    DB.save(table, DB.all(table).filter(r => r.id !== id));
  },
};

function uid(prefix) {
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ============================= SEED DATA ============================= */

function seedIfEmpty() {
  if (DB.all("roles").length) return; // already seeded

  DB.save("roles", [
    { id: "r1", name: "Marketing Officer", type: "Fixed", description: "Handles business development, premium growth targets." },
    { id: "r2", name: "Claims Officer", type: "Fixed", description: "Handles claim settlement and turnaround time." },
  ]);

  const bandTemplate = [
    { id: uid("b"), label: "At Target", minDelta: 0, maxDelta: 0, mark: 90 },
    { id: uid("b"), label: "Slightly below", minDelta: -1, maxDelta: -0.01, mark: 80 },
    { id: uid("b"), label: "Further below", minDelta: -2, maxDelta: -1.01, mark: 70 },
    { id: uid("b"), label: "Well below (floor)", minDelta: null, maxDelta: -2.01, mark: 50 },
    { id: uid("b"), label: "Slightly above", minDelta: 0.01, maxDelta: 1, mark: 95 },
    { id: uid("b"), label: "Well above (ceiling)", minDelta: 1.01, maxDelta: null, mark: 100 },
  ];
  DB.save("kpas", [
    {
      id: "k1", code: "KPI-001", name: "Premium Growth %", definition: "Growth in premium booked vs. same period last year.",
      unit: "%", direction: "higher-better", source: "GC",
      bands: bandTemplate.map(b => ({ ...b, id: uid("b") })),
    },
    {
      id: "k2", code: "KPI-002", name: "Average OD Claims TAT", definition: "Average turnaround time to settle Own Damage claims.",
      unit: "days", direction: "lower-better", source: "WB",
      bands: bandTemplate.map(b => ({ ...b, id: uid("b") })),
    },
  ]);

  DB.save("departments", [
    { id: "d1", name: "Marketing" },
    { id: "d2", name: "Claims" },
  ]);

  DB.save("matrix", [
    { id: "m1", roleId: "r1", kpaId: "k1", weightagePct: 60 },
    { id: "m2", roleId: "r1", kpaId: "k2", weightagePct: 40 },
    { id: "m3", roleId: "r2", kpaId: "k2", weightagePct: 100 },
  ]);

  DB.save("employees", [
    { id: "e1a", empCode: "EMP1001", name: "A. Sharma", departmentId: "d1", officeCode: "RO-CHN", roleId: "r1", kpaId: "k1", weightagePct: 60, startDate: "2026-04-01", endDate: null },
    { id: "e1b", empCode: "EMP1001", name: "A. Sharma", departmentId: "d1", officeCode: "RO-CHN", roleId: "r1", kpaId: "k2", weightagePct: 40, startDate: "2026-04-01", endDate: null },
    { id: "e2a", empCode: "EMP1002", name: "R. Iyer", departmentId: "d2", officeCode: "BO-CBE", roleId: "r2", kpaId: "k2", weightagePct: 100, startDate: "2026-04-01", endDate: null },
    { id: "e3a", empCode: "EMP1003", name: "P. Nair", departmentId: "d2", officeCode: "BO-CBE", roleId: "r2", kpaId: "k2", weightagePct: 50, startDate: "2026-04-01", endDate: null },
    { id: "e3b", empCode: "EMP1003", name: "P. Nair", departmentId: "d1", officeCode: "BO-CBE", roleId: "r1", kpaId: "k1", weightagePct: 30, startDate: "2026-04-01", endDate: null },
    { id: "e3c", empCode: "EMP1003", name: "P. Nair", departmentId: "d1", officeCode: "BO-CBE", roleId: "r1", kpaId: "k2", weightagePct: 20, startDate: "2026-04-01", endDate: null },
  ]);

  DB.save("targets", [
    { id: "t1", employeeId: "e1a", period: "2026-07", targetValue: 10, setBy: "RO Marketing Head" },
    { id: "t2", employeeId: "e1b", period: "2026-07", targetValue: 7, setBy: "RO Marketing Head" },

    { id: "w0", employeeId: "e1b", period: "2026-07", targetValue: 7, weightagePct: 40, actualValue: null, submittedDate: null, mark: null, acceptedBy: null, acceptedDate: null, status: "Pending Entry" },
    { id: "w1", employeeId: "e1a", period: "2026-07", targetValue: 10, weightagePct: 60, actualValue: 11, submittedDate: "2026-07-28", mark: 95, acceptedBy: "RO Marketing Head", acceptedDate: "2026-07-30", status: "Accepted" },

    { id: "w3", employeeId: "e3a", period: "2026-07", targetValue: 6, weightagePct: 50, actualValue: 6, submittedDate: "2026-07-26", mark: 90, acceptedBy: "RO Claims Head", acceptedDate: "2026-07-29", status: "Accepted" },
    { id: "w4", employeeId: "e3b", period: "2026-07", targetValue: 12, weightagePct: 30, actualValue: 13, submittedDate: "2026-07-28", mark: 95, acceptedBy: "RO Marketing Head", acceptedDate: "2026-07-30", status: "Accepted" },
  ]);
}

/* ============================= MARKING SCALE (reference only) ============================= */

const MarkingScale = {
  suggestedMark(kpa, targetValue, actualValue) {
    if (!kpa || targetValue === null || targetValue === undefined || actualValue === null || actualValue === undefined || isNaN(actualValue)) return null;
    const delta = kpa.direction === "higher-better" ? (actualValue - targetValue) : (targetValue - actualValue);
    for (const band of kpa.bands) {
      const minOk = band.minDelta === null || band.minDelta === undefined || delta >= band.minDelta;
      const maxOk = band.maxDelta === null || band.maxDelta === undefined || delta <= band.maxDelta;
      if (minOk && maxOk) return band.mark;
    }
    return null;
  },
};

/* ============================= LOOKUP HELPERS ============================= */

function roleName(id) { const r = DB.find("roles", id); return r ? r.name : "(unknown role)"; }
function kpaById(id) { return DB.find("kpas", id); }
function kpaName(id) { const k = kpaById(id); return k ? k.name : "(unknown KPA)"; }
function kpaCode(id) { const k = kpaById(id); return k ? k.code : "?"; }
function deptName(id) { const d = DB.find("departments", id); return d ? d.name : "(unknown dept)"; }
function empRow(id) { return DB.find("employees", id); }
function empLabel(row) {
  if (!row) return "(unknown)";
  return `${row.empCode} — ${row.name} — ${roleName(row.roleId)} — ${kpaName(row.kpaId)}`;
}

function statusBadge(status) {
  const cls = { "Pending Entry": "pending", "Submitted": "submitted", "Accepted": "accepted", "Rejected": "rejected" }[status] || "pending";
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

/* ============================= ROUTER ============================= */

const ROUTES = [
  { hash: "#/departments", label: "Departments", group: "Setup", render: renderDepartments },
  { hash: "#/roles", label: "Roles", group: "Setup", render: renderRoles },
  { hash: "#/kpas", label: "KPAs", group: "Setup", render: renderKpas },
  { hash: "#/matrix", label: "Role–KPA Matrix", group: "Setup", render: renderMatrix },
  { hash: "#/employees", label: "Employees", group: "Setup", render: renderEmployees },
  { hash: "#/targets", label: "Target Fixation", group: "Operations", render: renderTargets },
  { hash: "#/workbench-entry", label: "Workbench: Actual Entry", group: "Operations", render: renderWorkbenchEntry },
  { hash: "#/workbench-review", label: "Workbench: Review & Mark", group: "Operations", render: renderWorkbenchReview },
  { hash: "#/dashboard", label: "KPI Score Dashboard", group: "Reporting", render: renderDashboard },
];

function buildNav() {
  const nav = document.getElementById("navTabs");
  let html = "";
  let lastGroup = null;
  ROUTES.forEach(r => {
    if (r.group !== lastGroup) {
      html += `<div class="nav-group-label">${esc(r.group)}</div>`;
      lastGroup = r.group;
    }
    html += `<a href="${r.hash}" data-hash="${r.hash}"><span class="dot"></span>${esc(r.label)}</a>`;
  });
  nav.innerHTML = html;
}

function router() {
  let hash = window.location.hash || ROUTES[0].hash;
  const route = ROUTES.find(r => r.hash === hash) || ROUTES[0];
  document.querySelectorAll("nav.side-nav a").forEach(a => {
    a.classList.toggle("active", a.getAttribute("data-hash") === route.hash);
  });
  document.getElementById("crumbTitle").textContent = route.label;
  document.getElementById("app").innerHTML = "";
  route.render(document.getElementById("app"));
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", () => {
  seedIfEmpty();
  buildNav();
  router();
});

/* ============================= SCREEN: DEPARTMENTS ============================= */

function renderDepartments(app) {
  const rows = DB.all("departments");
  app.innerHTML = `
    <div class="card">

function defaultBands() {
  return [
    { id: uid("b"), label: "At Target", minDelta: 0, maxDelta: 0, mark: 90 },
    { id: uid("b"), label: "Slightly below", minDelta: -1, maxDelta: -0.01, mark: 80 },
    { id: uid("b"), label: "Slightly above", minDelta: 0.01, maxDelta: 1, mark: 95 },
  ];
}

function addKpa() {
  const code = document.getElementById("kpaCodeInput").value.trim();
  const name = document.getElementById("kpaNameInput").value.trim();
  if (!code || !name) return alert("Code and name are required.");
  if (DB.all("kpas").some(k => k.code === code)) return alert("That KPI Code is already used.");
  DB.upsert("kpas", {
    id: uid("k"), code, name,
    definition: document.getElementById("kpaDefInput").value.trim(),
    unit: document.getElementById("kpaUnitInput").value.trim(),
    direction: document.getElementById("kpaDirInput").value,
    source: document.getElementById("kpaSourceInput").value,
    bands: defaultBands(),
  });
  router();
}
function deleteKpa(id) {
  if (!confirm("Delete this KPA? (Matrix/Employee rows referencing it will be orphaned.)")) return;
  DB.remove("kpas", id); router();
}

function editKpaBands(kpaId) {
  const kpa = kpaById(kpaId);
  _kpaBandDraft = { kpaId, bands: JSON.parse(JSON.stringify(kpa.bands)) };
  router();
}
function renderBandEditor() {
  const kpa = kpaById(_kpaBandDraft.kpaId);
  const bands = _kpaBandDraft.bands;
  return `
    <div class="card">
      <h2 class="screen-title">Editing bands: ${esc(kpa.name)} (${esc(kpa.direction)})</h2>
      <p class="screen-desc">minDelta/maxDelta are offsets from target in "goodness" terms — positive = better than target. Leave blank for an open-ended floor/ceiling band.</p>
      <table>
        <thead><tr><th>Label</th><th>Min Δ</th><th>Max Δ</th><th>Mark</th><th></th></tr></thead>
        <tbody>
          ${bands.map((b, i) => `
            <tr>
              <td><input value="${esc(b.label)}" onchange="_kpaBandDraft.bands[${i}].label=this.value"></td>
              <td><input type="number" step="any" value="${b.minDelta === null ? "" : b.minDelta}" placeholder="(open)" onchange="_kpaBandDraft.bands[${i}].minDelta=this.value===''?null:parseFloat(this.value)"></td>
              <td><input type="number" step="any" value="${b.maxDelta === null ? "" : b.maxDelta}" placeholder="(open)" onchange="_kpaBandDraft.bands[${i}].maxDelta=this.value===''?null:parseFloat(this.value)"></td>
              <td><input type="number" step="any" value="${b.mark}" onchange="_kpaBandDraft.bands[${i}].mark=parseFloat(this.value)"></td>
              <td><button class="danger small" onclick="removeBandRow(${i})">Remove</button></td>
            </tr>`).join("")}
        </tbody>
      </table>
      <div style="margin-top:10px">
        <button class="small" onclick="addBandRow()">+ Add band row</button>
        <button class="primary" onclick="saveBandDraft()">Save bands</button>
        <button onclick="_kpaBandDraft=null; router();">Cancel</button>
      </div>
      <hr class="section-divider">
      <b>Live preview</b>
      <div class="inline-form-row" style="margin-top:8px">
        <div><label>Target value</label><input id="bandPreviewTarget" type="number" step="any" value="10" oninput="updateBandPreview()"></div>
        <div><label>Actual value</label><input id="bandPreviewActual" type="number" step="any" value="11" oninput="updateBandPreview()"></div>
        <div><label>Suggested mark</label><input id="bandPreviewResult" disabled></div>
      </div>
    </div>
  `;
}
function addBandRow() {
  _kpaBandDraft.bands.push({ id: uid("b"), label: "New band", minDelta: null, maxDelta: null, mark: 0 });
  router();
}
function removeBandRow(i) {
  _kpaBandDraft.bands.splice(i, 1);
  router();
}
function saveBandDraft() {
  const kpa = kpaById(_kpaBandDraft.kpaId);
  kpa.bands = _kpaBandDraft.bands;
  DB.upsert("kpas", kpa);
  _kpaBandDraft = null;
  router();
}
function updateBandPreview() {
  const t = parseFloat(document.getElementById("bandPreviewTarget").value);
  const a = parseFloat(document.getElementById("bandPreviewActual").value);
  const fakeKpa = { direction: kpaById(_kpaBandDraft.kpaId).direction, bands: _kpaBandDraft.bands };
  const result = MarkingScale.suggestedMark(fakeKpa, t, a);
  document.getElementById("bandPreviewResult").value = result === null ? "(no matching band)" : result;
}

/* ============================= SCREEN: MATRIX ============================= */

let _matrixRoleId = null;
let _matrixDraft = null;   // { roleId, rows: [{id, kpaId, weightagePct}, ...] } — unsaved edits live here
let _matrixDirty = false;  // true once the draft differs from what's on disk

function loadMatrixDraft(roleId) {
  const saved = DB.all("matrix").filter(m => m.roleId === roleId);
  _matrixDraft = { roleId, rows: saved.map(m => ({ ...m })) };
  _matrixDirty = false;
}

function renderMatrix(app) {
  const roles = DB.all("roles");
  if (!_matrixRoleId && roles.length) _matrixRoleId = roles[0].id;
  if (!_matrixDraft || _matrixDraft.roleId !== _matrixRoleId) loadMatrixDraft(_matrixRoleId);

  const kpas = DB.all("kpas");
  const rows = _matrixDraft.rows;
  const total = rows.reduce((s, m) => s + (parseFloat(m.weightagePct) || 0), 0);
  const canSave = total === 100;

  app.innerHTML = `
    <div class="card">
      <h2 class="screen-title">Role–KPA Matrix</h2>
      <p class="screen-desc">This is the template: which KPAs belong to a Role, and how much each is worth. Employees' rows default from here but can be adjusted per person. Edits here are a draft — nothing is saved until you click <b>Save changes</b>.</p>
      <label>Role</label>
      <select onchange="switchMatrixRole(this.value)">
        ${roles.map(r => `<option value="${r.id}" ${r.id === _matrixRoleId ? "selected" : ""}>${esc(r.name)}</option>`).join("")}
      </select>
      <hr class="section-divider">
      ${_matrixDirty ? `<div class="warn-box">You have unsaved changes to this role's Matrix. Click <b>Save changes</b> below to persist them, or <b>Discard</b> to revert.</div>` : ""}
      <table>
        <thead><tr><th>KPA</th><th>Weightage %</th><th></th></tr></thead>
        <tbody>
          ${rows.map((m, i) => `
            <tr>
              <td>${esc(kpaName(m.kpaId))} <span class="muted">(${esc(kpaCode(m.kpaId))})</span></td>
              <td><input type="number" step="any" value="${m.weightagePct}" oninput="_matrixDraft.rows[${i}].weightagePct=parseFloat(this.value)||0; _matrixDirty=true; router();"></td>
              <td><button class="danger small" onclick="removeMatrixDraftRow(${i})">Remove</button></td>
            </tr>`).join("")}
        </tbody>
      </table>
      <p>Total: <span class="${canSave ? "total-ok" : "total-bad"}">${total}%</span> ${canSave ? "✓" : "— must equal 100% before you can save"}</p>
      <div class="inline-form-row">
        <div>
          <label>Add KPA to this role</label>
          <select id="matrixAddKpaSelect">
            ${kpas.filter(k => !rows.some(r => r.kpaId === k.id)).map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join("")}
          </select>
        </div>
        <div style="flex:0"><button onclick="addMatrixDraftRow()">+ Add to draft</button></div>
      </div>
      <hr class="section-divider">
      <div class="inline-form-row" style="margin-bottom:0">
        <div style="flex:0"><button class="primary" ${(canSave && _matrixDirty) ? "" : "disabled"} onclick="saveMatrixDraft()">${_matrixDirty ? "Save changes" : "Saved ✓"}</button></div>
        <div style="flex:0"><button ${_matrixDirty ? "" : "disabled"} onclick="loadMatrixDraft(_matrixRoleId); router();">Discard</button></div>
      </div>
    </div>`;
}
function switchMatrixRole(roleId) {
  if (_matrixDirty && !confirm("You have unsaved changes on this role's Matrix. Switch roles and discard them?")) return;
  _matrixRoleId = roleId;
  loadMatrixDraft(roleId);
  router();
}
function addMatrixDraftRow() {
  const kpaId = document.getElementById("matrixAddKpaSelect").value;
  if (!kpaId) return alert("No KPA selected (all KPAs may already be in this role, or none exist yet).");
  _matrixDraft.rows.push({ id: uid("m"), roleId: _matrixRoleId, kpaId, weightagePct: 0 });
  _matrixDirty = true;
  router();
}
function removeMatrixDraftRow(i) {
  _matrixDraft.rows.splice(i, 1);
  _matrixDirty = true;
  router();
}
function saveMatrixDraft() {
  const total = _matrixDraft.rows.reduce((s, m) => s + (parseFloat(m.weightagePct) || 0), 0);
  if (total !== 100) return alert("Weightages must sum to exactly 100% before saving.");
  const others = DB.all("matrix").filter(m => m.roleId !== _matrixRoleId);
  DB.save("matrix", [...others, ..._matrixDraft.rows]);
  _matrixDirty = false;
  router();
}

function autoFetchKpiId() {

function addEmployeeRow() {

function updateEmployeeWeight(id, val) {

function deleteEmployeeRow(id) {

function addTarget() {
  const employeeId = document.getElementById("targetEmpInput").value;
  const period = document.getElementById("targetPeriodInput").value.trim();
  const targetValue = parseFloat(document.getElementById("targetValueInput").value);
  const setBy = document.getElementById("targetSetByInput").value.trim();
  if (!employeeId || !period || isNaN(targetValue) || !setBy) return alert("All fields are required.");

  const targetId = uid("t");
  DB.upsert("targets", { id: targetId, employeeId, period, targetValue, setBy });

  const emp = empRow(employeeId);
  DB.upsert("wao", {
    id: uid("w"), employeeId, period, targetValue,
    weightagePct: emp ? emp.weightagePct : 0,
    actualValue: null, submittedDate: null, mark: null,
    acceptedBy: null, acceptedDate: null, status: "Pending Entry",
  });
  router();
}

      <h2 class="screen-title">Workbench — Actual Entry</h2>
      <p class="screen-desc">The employee's own view: enter your actual performance value for each open Work Allocation Order.</p>
      ${rows.length === 0 ? `<p class="muted">Nothing waiting on employee entry right now.</p>` : `
      <table>
        <thead><tr><th>Employee</th><th>KPA</th><th>Period</th><th>Target</th><th>Status</th><th>Actual value</th><th></th></tr></thead>
        <tbody>
          ${rows.map(w => {
            const emp = empRow(w.employeeId);
            return `<tr>
              <td>${esc(emp ? emp.empCode + " — " + emp.name : "?")}</td>
              <td>${esc(emp ? kpaName(emp.kpaId) : "?")}</td>
              <td>${esc(w.period)}</td>
              <td>${w.targetValue}</td>
              <td>${statusBadge(w.status)}</td>
              <td><input id="actualInput_${w.id}" type="number" step="any" value="${w.actualValue === null ? "" : w.actualValue}"></td>
              <td><button class="primary small" onclick="submitActual('${w.id}')">Submit</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`}
    </div>`;
}
function submitActual(waoId) {
  const val = parseFloat(document.getElementById("actualInput_" + waoId).value);
  if (isNaN(val)) return alert("Enter a numeric actual value.");
  const w = DB.find("wao", waoId); if (!w) return;
  w.actualValue = val;
  w.submittedDate = todayStr();
  w.status = "Submitted";
  w.mark = null; // any previous mark is cleared on re-submit
  DB.upsert("wao", w);
  router();
}

/* ============================= SCREEN: WORKBENCH — REVIEW & MARK ============================= */

function renderWorkbenchReview(app) {
  const rows = DB.all("wao").filter(w => w.status === "Submitted");
  app.innerHTML = `
    <div class="card">
      <h2 class="screen-title">Workbench — Review &amp; Mark</h2>
      <p class="screen-desc">Accepting Authority's view. The band table is shown as a reference only — the mark is always a manual entry.</p>
      ${rows.length === 0 ? `<p class="muted">Nothing waiting for review right now.</p>` : rows.map(w => renderReviewRow(w)).join("")}
    </div>`;
}
function renderReviewRow(w) {
  const emp = empRow(w.employeeId);
  const kpa = emp ? kpaById(emp.kpaId) : null;
  const suggestion = kpa ? MarkingScale.suggestedMark(kpa, w.targetValue, w.actualValue) : null;
  return `
    <div class="card" style="background:var(--grey-light)">
      <b>${esc(emp ? emp.empCode + " — " + emp.name : "?")}</b> — ${esc(kpa ? kpa.name : "?")}
      <span class="muted">(${esc(w.period)}, target ${w.targetValue}, actual ${w.actualValue})</span>
      <table class="band-ref-table" style="margin-top:8px">
        <thead><tr><th>Label</th><th>Min Δ</th><th>Max Δ</th><th>Mark</th></tr></thead>
        <tbody>
          ${kpa ? kpa.bands.map(b => `<tr><td>${esc(b.label)}</td><td>${b.minDelta === null ? "(open)" : b.minDelta}</td><td>${b.maxDelta === null ? "(open)" : b.maxDelta}</td><td>${b.mark}</td></tr>`).join("") : ""}
        </tbody>
      </table>
      <p class="muted">Reference suggests: <b>${suggestion === null ? "no matching band" : suggestion}</b> — you are not required to use this.</p>
      <div class="inline-form-row">
        <div><label>Mark (manual entry)</label><input id="markInput_${w.id}" type="number" step="any" value="${suggestion === null ? "" : suggestion}"></div>
        <div><label>Accepting authority</label><input id="acceptByInput_${w.id}" placeholder="e.g. RO Claims Head"></div>
        <div style="flex:0"><button class="primary" onclick="acceptWao('${w.id}')">Accept</button></div>
        <div style="flex:0"><button class="danger" onclick="rejectWao('${w.id}')">Reject</button></div>
      </div>
    </div>`;
}
function acceptWao(waoId) {
  const mark = parseFloat(document.getElementById("markInput_" + waoId).value);
  const acceptedBy = document.getElementById("acceptByInput_" + waoId).value.trim();
  if (isNaN(mark) || !acceptedBy) return alert("Mark and Accepting Authority name are required.");
  const w = DB.find("wao", waoId); if (!w) return;
  w.mark = mark; w.acceptedBy = acceptedBy; w.acceptedDate = todayStr(); w.status = "Accepted";
  DB.upsert("wao", w);
  router();
}
function rejectWao(waoId) {
  const w = DB.find("wao", waoId); if (!w) return;
  w.status = "Rejected";
  DB.upsert("wao", w);
  router();
}

/* ============================= SCREEN: KPI SCORE DASHBOARD ============================= */

function renderDashboard(app) {
  const employees = DB.all("employees");
  const codes = [...new Set(employees.map(e => e.empCode))];
  const selectedCode = window._dashCode || codes[0];
  const periods = [...new Set(DB.all("targets").map(t => t.period))];
  const selectedPeriod = window._dashPeriod || periods[0] || "2026-07";

  const personRows = employees.filter(e => e.empCode === selectedCode);
  const waoAll = DB.all("wao");

  let final = 0, scoredCount = 0;
  const tableRows = personRows.map(row => {
    const wao = waoAll.find(w => w.employeeId === row.id && w.period === selectedPeriod && w.status === "Accepted");
    if (wao) {
      const weighted = (wao.mark * wao.weightagePct) / 100;
      final += weighted;
      scoredCount++;
      return { row, wao, weighted };
    }
    return { row, wao: null, weighted: null };
  });

  app.innerHTML = `
    <div class="card">
      <h2 class="screen-title">KPI Score Dashboard</h2>
      <p class="screen-desc">Flat weighted sum of mark × weightage across a person's KPA-rows. Only counts Work Allocation Orders with status Accepted.</p>
      <div class="inline-form-row">
        <div><label>Employee</label>
          <select onchange="window._dashCode=this.value; router();">
            ${codes.map(c => {
              const n = employees.find(e => e.empCode === c).name;
              return `<option value="${c}" ${c === selectedCode ? "selected" : ""}>${esc(c)} — ${esc(n)}</option>`;
            }).join("")}
          </select>
        </div>
        <div><label>Period</label><input value="${esc(selectedPeriod)}" onchange="window._dashPeriod=this.value; router();"></div>
      </div>
      <hr class="section-divider">
      <table>
        <thead><tr><th>KPA (via role)</th><th>Weightage</th><th>Actual</th><th>Mark</th><th>Weighted</th></tr></thead>
        <tbody>
          ${tableRows.map(({ row, wao, weighted }) => `
            <tr>
              <td>${esc(kpaName(row.kpaId))} <span class="muted">(${esc(roleName(row.roleId))})</span></td>
              <td>${row.weightagePct}%</td>
              <td>${wao && wao.actualValue !== null ? wao.actualValue : `<span class="muted">— not yet entered/accepted</span>`}</td>
              <td>${wao ? wao.mark : "—"}</td>
              <td>${weighted === null ? "—" : weighted.toFixed(1)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <div class="score-final">
        <div>
          <div style="font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-500)">Final KPI Score</div>
          <div>${final.toFixed(1)}<span style="font-size:14px;font-weight:600;color:var(--slate-500)"> / 100</span></div>
        </div>
        ${scoredCount < personRows.length ? `<span class="score-note">Partial — ${scoredCount} of ${personRows.length} KPAs scored</span>` : `<span class="badge accepted">Complete</span>`}
      </div>
    </div>`;
}
</script>
